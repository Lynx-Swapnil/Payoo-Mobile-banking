<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Register</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- tailwind + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="log w-[200px] mx-auto pt-32">
        <img src="assets/Logo-full.png" alt="">
    </div>

    <div class="form pt-10">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
            <div class="card-body">
                <h2 class="text-2xl font-bold text-center mb-4">Create Account</h2>
                
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Mobile Number</label>
                    <input id="register-number" maxlength="11" type="text" class="input rounded-full bg-base-200" placeholder="Enter your 11 digit number" />

                    <br>

                    <label class="label text-neutral font-bold">Create 4 Digit PIN</label>
                    <input id="register-pin" maxlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Create 4 digit pin" />
                    
                    <br>

                    <label class="label text-neutral font-bold">Confirm PIN</label>
                    <input id="register-pin-confirm" maxlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Confirm 4 digit pin" />
                    
                    <div></div>
                    
                    <button id="register-btn" class="btn btn-primary mt-4 rounded-full">
                        <span id="register-text">Register</span>
                        <span id="register-loading" class="loading loading-spinner loading-sm hidden"></span>
                    </button>

                    <div class="text-center mt-4">
                        <p class="text-sm text-neutral/70">Already have an account? 
                            <a href="index.html" class="text-primary font-semibold">Login here</a>
                        </p>
                    </div>
                </fieldset>
            </div>
        </div>

        <!-- Info Card -->
        <div class="card bg-gradient-to-r from-primary/10 to-primary/5 border border-primary/20 w-full max-w-sm mx-auto mt-5">
            <div class="card-body py-4">
                <div class="flex items-start gap-3">
                    <i class="fa-solid fa-circle-info text-primary text-xl mt-1"></i>
                    <div>
                        <h3 class="font-bold text-sm">Welcome Bonus</h3>
                        <p class="text-xs text-neutral/70 mt-1">New users get $1234.56 starting balance!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script/api.js"></script>
    <script src="script/register.js"></script>
</body>
</html>
